<!-- requests.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Request a Game</title>
    <script defer src="main.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* For Firefox */
    html {
        scrollbar-width: thin; /* Options: auto, thin, none */
        scrollbar-color: transparent transparent; /* Thumb color and track color */
        }
        /* Matrix Green Theme */
        :root {
            --matrix-green: #00ff41;
            --matrix-darker: #0a0a0a;
            --matrix-accent: #00cc33;
            --cyber-border: rgba(0, 255, 65, 0.3);
            --cyber-gradient: linear-gradient(45deg, var(--matrix-green) 0%, var(--matrix-accent) 100%);
        }

        body {
            font-family: 'Inconsolata', monospace;
            background: var(--matrix-darker);
            color: #fff;
            margin: 0;
            overflow-x: hidden;
        }

        header {
            padding: 1.5rem;
            background: rgba(10, 20, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--matrix-green);
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--cyber-gradient);
            opacity: 0.1;
            pointer-events: none;
        }

        header a {
            color: var(--matrix-green);
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
            position: relative;
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
        }

        header a:hover {
            text-shadow: 0 0 10px var(--matrix-green);
            border: 1px solid var(--matrix-green);
            background: rgba(0, 255, 65, 0.1);
        }

        /* ===== MATRIX FORM ENHANCEMENTS ===== */
.request-container {
    position: relative;
    max-width: 700px;
    margin: 4rem auto;
    padding: 3rem;
    background: var(--matrix-darker);
    border: 1px solid var(--matrix-green);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0, 255, 65, 0.1);
    transition: transform 0.3s ease;
}

.request-container::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        45deg,
        transparent 45%,
        var(--matrix-green) 50%,
        transparent 55%
    );
    animation: matrixScan 6s linear infinite;
    opacity: 0.1;
    pointer-events: none;
}

.request-container::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        rgba(0, 255, 65, 0.05) 0px,
        rgba(0, 255, 65, 0.05) 1px,
        transparent 1px,
        transparent 3px
    );
    pointer-events: none;
    z-index: 1;
}

@keyframes matrixScan {
    0% { transform: translate(0, 0) rotate(45deg); }
    100% { transform: translate(100%, 100%) rotate(45deg); }
}

.neon-title {
    position: relative;
    font-size: 2.5rem;
    text-align: center;
    margin-bottom: 2.5rem;
    color: var(--matrix-green);
    text-shadow: 0 0 15px var(--matrix-green);
}

.neon-title::after {
    content: '';
    position: absolute;
    bottom: -15px;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--matrix-green), transparent);
    filter: drop-shadow(0 0 5px var(--matrix-green));
}

.form-group {
    position: relative;
    margin-bottom: 2rem;
    z-index: 2;
}

.form-group label {
    display: block;
    margin-bottom: 1rem;
    color: var(--matrix-green);
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 5px var(--matrix-green);
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 665px;
    padding: 1.2rem;
    background: rgba(0, 20, 0, 0.5);
    border: 1px solid var(--matrix-green);
    color: var(--matrix-green);
    font-family: 'Inconsolata', monospace;
    border-radius: 4px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    caret-color: var(--matrix-green);
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    box-shadow: 0 0 25px var(--matrix-green);
    background: rgba(0, 30, 0, 0.7);
    border-color: #00ff88;
    animation: inputGlitch 0.3s linear;
}

@keyframes inputGlitch {
    0% { transform: translateX(0); }
    20% { transform: translateX(2px); }
    40% { transform: translateX(-2px); }
    60% { transform: translateX(1px); }
    80% { transform: translateX(-1px); }
    100% { transform: translateX(0); }
}

.form-group textarea {
    min-height: 150px;
    resize: vertical;
}

.submit-btn {
    position: relative;
    width: 100%;
    padding: 1.5rem;
    background: linear-gradient(45deg, var(--matrix-dark), var(--matrix-darker));
    border: 2px solid var(--matrix-green);
    color: var(--matrix-green);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.4s ease;
}

.submit-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(0, 255, 65, 0.2),
        transparent
    );
    transition: 0.6s;
}

.submit-btn:hover {
    text-shadow: 0 0 10px var(--matrix-green);
    box-shadow: 0 0 30px var(--matrix-green);
    transform: translateY(-2px);
}

.submit-btn:hover::before {
    left: 100%;
}

.submit-btn:active {
    transform: translateY(1px);
    box-shadow: 0 0 15px var(--matrix-green);
}

/* Binary Particle Effect */
.binary-particles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    background: repeating-linear-gradient(
        0deg,
        transparent 0%,
        transparent 98%,
        rgba(0, 255, 65, 0.1) 99%,
        rgba(0, 255, 65, 0.1) 100%
    );
    background-size: 100% 10px;
    animation: binaryScroll 40s linear infinite;
}

@keyframes binaryScroll {
    from { background-position: 0 100%; }
    to { background-position: 0 0; }
}

/* Form Validation Effects */
input:invalid,
select:invalid,
textarea:invalid {
    animation: denyShake 0.4s ease;
}

@keyframes denyShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(10px); }
    40% { transform: translateX(-10px); }
    60% { transform: translateX(5px); }
    80% { transform: translateX(-5px); }
}

input:valid:not(:placeholder-shown),
select:valid,
textarea:valid:not(:placeholder-shown) {
    border-color: #00ff88;
    box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
}

/* Custom Select Arrow */
select {
    appearance: none;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300ff41'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 1rem center;
    background-size: 1.2rem;
}

/* Hover Effect for Select */
select:hover {
    cursor: pointer;
    background-color: rgba(0, 30, 0, 0.7);
}
        
    </style>
</head>
<body>
    <header>
        <a href="index.html">◄ RETURN HOME</a>
    </header>

    <main>
        <section class="page active" id="request-page">
            <div class="container">
                <div class="request-container">
                    <h2 class="neon-title">GAME REQUESTS</h2>
                    <form id="request-form" action="https://formspree.io/f/manobzdg" method="POST">
                        <input type="hidden" name="_next" value="#request?success=true">
                        <input type="hidden" name="_subject" value="New CrackHub Request">
                        <input type="text" name="_gotcha" style="display:none">

                        <div class="form-group">
                            <label for="game-name">GAME NAME</label>
                            <input type="text" id="game-name" name="game" required>
                        </div>

                        <div class="form-group">
                            <label for="request-type">Game Version</label>
                            <input type="text" id="game-version" name="game">
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="message">ADDITONAL NOTES</label>
                            <textarea id="message" name="message" rows="4"></textarea>
                        </div>

                        <button type="submit" class="submit-btn">
                            SUBMIT REQUEST ►
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>
<div id="toast-container" aria-live="polite" aria-atomic="true"></div>


<script>
// Toast Controller
function showToast(message, type = 'success', duration = 3000) {
    const toast = document.createElement('div');
    toast.className = `hack-toast ${type}`;
    toast.textContent = message;
    
    // Add theming
    switch(type) {
        case 'error':
            toast.style.background = 'var(--matrix-darker)';
            toast.style.borderColor = 'var(--uncracked)';
            toast.style.color = 'var(--uncracked)';
            break;
        case 'warning':
            toast.style.background = 'var(--matrix-darker)';
            toast.style.borderColor = 'var(--denuvo)';
            toast.style.color = 'var(--denuvo)';
            break;
        default:
            toast.style.background = 'var(--matrix-darker)';
            toast.style.borderColor = 'var(--matrix-green)';
            toast.style.color = 'var(--matrix-green)';
    }

    document.getElementById('toast-container').appendChild(toast);
    
    // Add entrance animation
    setTimeout(() => toast.style.opacity = '1', 10);
    
    // Remove after duration
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, duration);
}

// Form Submission Handler
document.getElementById('request-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const form = e.target;
    const formData = new FormData(form);
    
    try {
        const response = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'Accept': 'application/json'
            }
        });
        
        if (response.ok) {
            showToast('Request successfully submitted!', 'success');
            form.reset();
        } else {
            showToast('Submission failed. Please try again.', 'error');
        }
    } catch (error) {
        showToast('Network error. Please check your connection.', 'error');
    }
});
</script>

<style>
/* Enhanced Toast Notifications */
.hack-toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 1rem 2rem;
    border-radius: 4px;
    font-family: 'Inconsolata', monospace;
    font-weight: bold;
    z-index: 10000;
    display: flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(5px);
    box-shadow: var(--neon-glow);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid;
    background: var(--matrix-darker);
}

.hack-toast::before {
    content: '✦';
    font-size: 1.2em;
    filter: drop-shadow(0 0 2px currentColor);
}

.hack-toast.success {
    color: var(--cracked);
    border-color: var(--cracked);
    background: linear-gradient(
        90deg,
        rgba(0, 255, 65, 0.1),
        rgba(0, 255, 65, 0.05)
    );
}

.hack-toast.error {
    color: var(--uncracked);
    border-color: var(--uncracked);
    background: linear-gradient(
        90deg,
        rgba(255, 51, 51, 0.1),
        rgba(255, 51, 51, 0.05)
    );
}

.hack-toast.warning {
    color: var(--denuvo);
    border-color: var(--denuvo);
    background: linear-gradient(
        90deg,
        rgba(255, 204, 0, 0.1),
        rgba(255, 204, 0, 0.05)
    );
}

@keyframes toast-in {
    0% {
        transform: translate(-50%, 20px);
        opacity: 0;
    }
    100% {
        transform: translate(-50%, 0);
        opacity: 1;
    }
}

@keyframes toast-out {
    0% {
        transform: translate(-50%, 0);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, 20px);
        opacity: 0;
    }
}
</style>
</body>
</html>
